body:
  - type: markdown
    attributes:
      value: |
        **Before you post:** this space is public. Remove your own domain and host names, your home directory path,
        your ntfy topic and your own IP addresses from anything you write or paste. Never paste the API key or the
        config file.

        **A security problem does not belong here.** Report it privately, see
        [SECURITY.md](https://github.com/arcymonek/reportabuseipdb/blob/main/SECURITY.md).

        Something that does not work as documented is a bug: please open an issue with the bug report form instead.

        Note: the maintainer protects the reliability of the reports sent to AbuseIPDB above all else, so an idea that
        would loosen a safeguard (age filter, scenario lists, comment rules, validation) needs a strong argument.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      description: Everything you write below is public and cannot be fully taken back.
      options:
        - label: I removed my own domain and host names, home directory path, ntfy topic and own IP addresses from everything below.
          required: true
        - label: I am not pasting the API key or the config file (`abuseipdb.conf`).
          required: true
  - type: textarea
    id: goal
    attributes:
      label: What do you want to achieve?
      description: Describe the problem or the need first, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could the tool help with this?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and risks
      description: "Optional. What else did you consider? Could the idea make the tool report something that is not a real, locally observed attack, or reveal something about the operator?"
