# Runs the whole test suite on Linux for every push to main and for every pull request (a branch is
# tested through its pull request; a draft is enough). The wrapper tests need
# flock, GNU date and jq, which the Ubuntu runner provides; nothing here touches AbuseIPDB or ntfy
# (curl and the generator are mocks in the tests).
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned, not "ubuntu-latest": GitHub moves that label to Ubuntu 26 on 2026-10-19, and the tools the tests use
    # (jq, shellcheck, bash) should change when we decide, not on GitHub's schedule.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Python (timestamp parsing differs before 3.11) and the newest.
        python: ["3.9", "3.x"]
    steps:
      # Third-party actions are pinned to a full commit SHA, not to a tag: a tag is a movable label, and
      # whoever controls the action's repository could move it to other code. The comment names the tag
      # the SHA was taken from. To update: see "Pinned CI actions" in docs/DEVELOPMENT.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Tools
        run: |
          command -v jq flock shellcheck || sudo apt-get install -y jq util-linux shellcheck
      - name: Shell syntax
        run: |
          bash -n abuseipdb_send.sh
          bash -n tools/pre-commit tools/commit-msg tools/lib-privacy.sh tools/release_notes.sh
          shellcheck -x -S error abuseipdb_send.sh tools/pre-commit tools/commit-msg tools/release_notes.sh
          shellcheck -s bash -S error tools/lib-privacy.sh
      - name: Tests
        run: python -m unittest discover -v tests
